<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./background/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Portfolio de Sébastien Ripert, développeur web junior spécialisé JavaScript / React.js / Node.js. Découvrez mes réalisations." />

    <!-- Sécurité : politique de référent (la CSP complète est injectée dans le build de prod) -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SEO / partage sur les réseaux (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Portfolio de Sébastien Ripert — Développeur Web" />
    <meta property="og:description" content="Développeur web junior spécialisé JavaScript / React.js / Node.js. Découvrez mes réalisations." />
    <meta property="og:url" content="https://sebrip.github.io/Portfolio/" />
    <meta property="og:image" content="https://sebrip.github.io/Portfolio/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sébastien Ripert — Développeur, Agents IA" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portfolio de Sébastien Ripert — Développeur Web" />
    <meta name="twitter:description" content="Développeur web junior spécialisé JavaScript / React.js / Node.js. Découvrez mes réalisations." />
    <meta name="twitter:image" content="https://sebrip.github.io/Portfolio/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Poppins : graisses réellement utilisées par le CSS (300/400/500/600/700) + JetBrains Mono pour les détails techniques -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Styles globaux (reset CSS + image de fond du body) -->
    <link rel="stylesheet" href="%PUBLIC_URL%/style.css" />
    <title>Portfolio de Sébastien Ripert</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
