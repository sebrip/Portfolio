<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon assorti au logo SR_ de la navbar : fond sombre, bordure dorée, micro-grille, monogramme doré -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161c2d"/>
      <stop offset="1" stop-color="#090c16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd43b" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffd43b" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#78a0dc" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.45" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#ffb63b"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="1" y="1" width="62" height="62" rx="14"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#round)" stroke="#78a0dc" stroke-opacity="0.12" stroke-width="1">
    <path d="M16 1v62M32 1v62M48 1v62M1 16h62M1 32h62M1 48h62"/>
  </g>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <text x="28" y="43" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="30" font-weight="700" fill="url(#gold)">SR</text>
  <rect x="44" y="42" width="11" height="4" rx="2" fill="#e9edf6" opacity="0.85"/>
</svg>
